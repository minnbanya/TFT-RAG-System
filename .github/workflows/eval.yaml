name: RAG Faithfulness Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
      # Sleep to wait for weaviate container setup
    - name: Start Local Weaviate
      run: |
        docker compose up -d
        sleep 15 
        
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ingest Data (Populate CI Vector Store)
      run: python -m src.ingestion.vector_store
      
    - name: Run Ragas LLM-as-a-Judge Evaluation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python -m eval.run_eval